<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Natillerapp">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#207042"/>
      <stop offset="1" stop-color="#124A2C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0" stop-color="#3c9560" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3c9560" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- disco verde circular (exterior transparente) -->
  <circle cx="256" cy="256" r="243" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="243" fill="url(#glow)"/>

  <!-- borde circular -->
  <circle cx="256" cy="256" r="237" fill="none" stroke="#F7F3E7" stroke-width="6"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#F7F3E7" stroke-opacity=".47" stroke-width="2"/>

  <!-- comunidad: aro + socios -->
  <g fill="#F7F3E7">
    <circle cx="256" cy="256" r="161" fill="none" stroke="#F7F3E7" stroke-opacity=".28" stroke-width="4.5"/>
    <circle cx="256"   cy="95"    r="23"/>
    <circle cx="369.8" cy="142.2" r="23"/>
    <circle cx="417"   cy="256"   r="23"/>
    <circle cx="369.8" cy="369.8" r="23"/>
    <circle cx="256"   cy="417"   r="23"/>
    <circle cx="142.2" cy="369.8" r="23"/>
    <circle cx="95"    cy="256"   r="23"/>
    <circle cx="142.2" cy="142.2" r="23"/>
  </g>

  <!-- moneda del ahorro -->
  <circle cx="256" cy="256" r="84" fill="#F7F3E7"/>
  <circle cx="256" cy="256" r="79" fill="none" stroke="#DFD5BC" stroke-width="5"/>
  <circle cx="256" cy="256" r="66" fill="none" stroke="#DFD5BC" stroke-opacity=".6" stroke-width="2"/>
  <text x="256" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700"
        font-size="150" fill="#185431" text-anchor="middle" dominant-baseline="central">$</text>
</svg>
