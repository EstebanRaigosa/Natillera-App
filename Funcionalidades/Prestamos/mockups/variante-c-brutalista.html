<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>NATILLERAPP · PRÉSTAMOS · BRUTALISTA</title>

<!-- Fuentes brutalistas: Archivo Black (títulos/cifras) + Archivo (cuerpo) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet" />

<!-- Vue 3 (global build) — DEBE ir ANTES del script de la app -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<!-- Tailwind Play CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#111111',
          crema: '#F5F1E8',
          amarillo: '#FFE500',
          azul: '#2E5BFF',
          rojo: '#FF4D3D',
          verde: '#12A150',
          'verde-pale': '#DDF3E4',
        },
        fontFamily: {
          black: ['"Archivo Black"', 'system-ui', 'sans-serif'],
          body: ['Archivo', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>

<!-- Motor financiero (NO se modifica). Debe cargar ANTES de la app. -->
<script src="./engine.js"></script>

<style>
  :root {
    --app-vh: 100vh;
    --app-vh: 100dvh;
  }
  html, body { height: 100%; margin: 0; }
  body {
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    min-height: 100dvh;
    background: #F5F1E8;
    font-family: 'Archivo', system-ui, sans-serif;
    color: #111111;
  }
  .font-black { font-family: 'Archivo Black', system-ui, sans-serif; }

  /* Inputs a >=16px para evitar zoom en iOS */
  input, select, textarea, button { font-size: 16px; font-family: 'Archivo', system-ui, sans-serif; }
  button { touch-action: manipulation; }

  /* Scroll-lock del body con modal abierto */
  body.no-scroll { overflow: hidden; }

  /* ===== BRUTALISMO: bordes duros + sombras sin blur ===== */
  .brut { border: 3px solid #111111; }
  .brut-2 { border: 2px solid #111111; }
  .sh { box-shadow: 6px 6px 0 #111111; }
  .sh-sm { box-shadow: 4px 4px 0 #111111; }
  .sh-xs { box-shadow: 3px 3px 0 #111111; }

  /* Botón brutalista: al activar se hunde */
  .btn-brut {
    border: 3px solid #111111;
    box-shadow: 4px 4px 0 #111111;
    transition: transform .04s linear, box-shadow .04s linear;
    text-transform: uppercase;
    font-family: 'Archivo Black', system-ui, sans-serif;
    letter-spacing: .3px;
    min-height: 44px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer;
  }
  .btn-brut:active:not(:disabled) { transform: translate3d(4px,4px,0); box-shadow: 0 0 0 #111111; }
  .btn-brut:disabled { opacity: .45; cursor: not-allowed; box-shadow: 2px 2px 0 #111111; }

  /* Inputs brutalistas */
  .in-brut {
    border: 3px solid #111111;
    background: #fff;
    padding: 10px 12px;
    width: 100%;
    font-weight: 700;
    outline: none;
    box-shadow: inset 0 0 0 0 #111;
  }
  .in-brut:focus { box-shadow: 4px 4px 0 #FFE500; }
  select.in-brut { -webkit-appearance: menulist; appearance: menulist; }

  /* Buscador: icono por FLEX (no absolute + translate-y) para no descentrar en iOS al enfocar */
  .search-wrap { display: flex; align-items: center; gap: 10px; }
  .search-wrap > svg { flex: none; }
  .search-wrap > input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; box-shadow: none; padding: 0; font-size: 16px; }
  .search-wrap:focus-within { box-shadow: 4px 4px 0 #FFE500; }

  /* Chip de estado */
  .chip {
    border: 2px solid #111111;
    font-family: 'Archivo Black', system-ui, sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    padding: 3px 8px;
    display: inline-flex; align-items: center; gap: 4px;
    letter-spacing: .3px;
  }

  /* Barra de progreso de bloque */
  .prog-track { border: 3px solid #111; background: #fff; height: 26px; position: relative; overflow: hidden; }
  .prog-fill { height: 100%; background: #12A150; }
  .prog-fill.mora { background: #FF4D3D; }
  .prog-fill.done { background: #111; }

  /* Sello "PAGADO" diagonal estampado */
  .stamp {
    position: absolute;
    top: 44%; left: 50%;
    transform: translate3d(-50%,-50%,0) rotate(-14deg);
    -webkit-transform: translate3d(-50%,-50%,0) rotate(-14deg);
    border: 5px solid #12A150;
    color: #12A150;
    font-family: 'Archivo Black', system-ui, sans-serif;
    font-size: 44px; letter-spacing: 4px;
    padding: 4px 18px;
    pointer-events: none;
    opacity: .85;
    z-index: 4;
    white-space: nowrap;
    background: rgba(245,241,232,.35);
  }
  .stamp-sm { font-size: 30px; border-width: 4px; padding: 2px 12px; letter-spacing: 3px; }

  /* Velo de modal: negro sólido semitransparente (sin blur, encaja brutalista) */
  .veil { background: rgba(17,17,17,.82); }

  /* Modal: full-screen seguro en iOS */
  .modal-shell {
    max-height: calc(var(--app-vh) - 24px);
    max-height: calc(100dvh - 24px);
  }
  .modal-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .safe-bottom { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }

  /* keyframes con prefijo -webkit- y translate3d para GPU en iOS */
  @-webkit-keyframes popIn { from { -webkit-transform: translate3d(0,10px,0) scale(.98); opacity:0 } to { -webkit-transform: translate3d(0,0,0) scale(1); opacity:1 } }
  @keyframes popIn { from { transform: translate3d(0,10px,0) scale(.98); opacity:0 } to { transform: translate3d(0,0,0) scale(1); opacity:1 } }
  .pop { -webkit-animation: popIn .14s ease-out; animation: popIn .14s ease-out; }

  /* Scrollbar chunky */
  .modal-scroll::-webkit-scrollbar { width: 12px; }
  .modal-scroll::-webkit-scrollbar-track { background: #F5F1E8; border-left: 3px solid #111; }
  .modal-scroll::-webkit-scrollbar-thumb { background: #111; }

  .tabnum { font-variant-numeric: tabular-nums; }
  .strike { text-decoration: line-through; text-decoration-thickness: 3px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const { createApp, ref, reactive, computed, watch, nextTick } = Vue;

createApp({
  setup() {
    // ============================================================
    // 1. ESTADO REACTIVO — declarado ANTES de computed/watch
    // ============================================================
    const S = reactive(PE.initState());          // { fondo, socios, prestamos, reglas }
    const rol = ref('admin');                     // 'admin' | 'visor'
    const esAdmin = computed(() => rol.value === 'admin');

    const tab = ref('cobrar');                    // 'cobrar' | 'pagados'
    const buscar = ref('');

    // Vistas overlay
    const showCrear = ref(false);
    const showDetalle = ref(false);
    const showAbono = ref(false);
    const showRefi = ref(false);
    const showEliminar = ref(false);
    const showCobro = ref(false);
    const showComprobante = ref(false);
    const showTelefono = ref(false);

    const prestamoActivoId = ref(null);
    const comprobante = ref(null);                // objeto genérico para el afiche
    const telefonoTmp = ref('');
    const telefonoPendienteAccion = ref(null);

    // Toast simple
    const toast = ref(null);
    function flash(msg) {
      toast.value = msg;
      setTimeout(() => { if (toast.value === msg) toast.value = null; }, 2600);
    }

    // ---- scroll lock cuando cualquier modal está abierto ----
    const algunModal = computed(() =>
      showCrear.value || showDetalle.value || showAbono.value || showRefi.value ||
      showEliminar.value || showCobro.value || showComprobante.value || showTelefono.value
    );
    watch(algunModal, (v) => {
      document.body.classList.toggle('no-scroll', v);
    });

    // ============================================================
    // 2. DERIVADOS DE LISTA
    // ============================================================
    const prestamoActivo = computed(() =>
      S.prestamos.find(p => p.id === prestamoActivoId.value) || null
    );

    function nombreSocio(id) { return (PE.socio(id) || {}).nombre || '—'; }
    function inicial(id) {
      const n = nombreSocio(id).trim();
      return n ? n[0].toUpperCase() : '?';
    }

    const totales = computed(() => PE.totalesModulo(S.prestamos));

    const listaCobrar = computed(() => filtrar(S.prestamos.filter(p => p.estado === 'activo')));
    const listaPagados = computed(() => filtrar(S.prestamos.filter(p => p.estado === 'pagado')));

    function filtrar(arr) {
      const q = buscar.value.trim().toLowerCase();
      if (!q) return arr;
      return arr.filter(p => nombreSocio(p.socioId).toLowerCase().includes(q));
    }
    const listaActual = computed(() => tab.value === 'cobrar' ? listaCobrar.value : listaPagados.value);

    function resumen(p) { return PE.resumenPrestamo(p); }
    function progreso(p) {
      const abonado = p.plan.reduce((s, c) => s + c.abonado, 0);
      return p.total > 0 ? Math.min(100, Math.round(abonado / p.total * 100)) : 0;
    }

    // ============================================================
    // 3. CREAR PRÉSTAMO — form + cálculo en vivo + validación
    // ============================================================
    const sociosActivos = computed(() => S.socios.filter(s => s.activo));

    const form = reactive({
      socioId: '',
      capital: 500000,
      tasaPct: 2,
      tipo: 'simple',
      modalidad: 'normal',
      nCuotas: 6,
      periodicidad: 'mensual',
      fechaPrimeraCuota: PE.isoDate(new Date(2026, 7, 5)),
      medioEntrega: 'transferencia',
    });

    function abrirCrear() {
      form.socioId = sociosActivos.value[0]?.id || '';
      form.capital = 500000;
      form.tasaPct = 2;
      form.tipo = 'simple';
      form.modalidad = 'normal';
      form.nCuotas = 6;
      form.periodicidad = 'mensual';
      form.fechaPrimeraCuota = PE.isoDate(new Date(2026, 7, 5));
      form.medioEntrega = 'transferencia';
      showCrear.value = true;
    }

    const calcVivo = computed(() => {
      const capital = Number(form.capital) || 0;
      const nCuotas = Number(form.nCuotas) || 0;
      const tasaPct = Number(form.tasaPct) || 0;
      if (capital <= 0 || nCuotas <= 0) {
        return { plan: [], interesTotal: 0, total: 0, valorCuota: 0, desembolso: 0 };
      }
      const gen = PE.generarPlan({
        capital, tasaPct, tipo: form.tipo, modalidad: form.modalidad,
        nCuotas, periodicidad: form.periodicidad,
        fechaPrimeraCuota: new Date(form.fechaPrimeraCuota),
      });
      const des = PE.desembolso({ capital, interesTotal: gen.interesTotal, modalidad: form.modalidad });
      return { ...gen, desembolso: des };
    });

    const erroresCrear = computed(() => {
      return PE.validarPrestamo({
        capital: Number(form.capital) || 0,
        tasaPct: Number(form.tasaPct) || 0,
        tipo: form.tipo,
        modalidad: form.modalidad,
        nCuotas: Number(form.nCuotas) || 0,
        periodicidad: form.periodicidad,
        medioEntrega: form.medioEntrega,
        plazoMaximo: S.reglas.plazo_maximo,
      }, S.fondo);
    });
    function errorDe(campo) {
      const e = erroresCrear.value.find(x => x.campo === campo);
      return e ? e.msg : null;
    }
    const puedeCrear = computed(() => form.socioId && erroresCrear.value.length === 0);

    function confirmarCrear() {
      if (!puedeCrear.value) return;
      const p = PE.crearPrestamo({
        socioId: form.socioId,
        capital: Number(form.capital),
        tasaPct: Number(form.tasaPct),
        tipo: form.tipo,
        modalidad: form.modalidad,
        nCuotas: Number(form.nCuotas),
        periodicidad: form.periodicidad,
        fechaPrimeraCuota: new Date(form.fechaPrimeraCuota),
        medioEntrega: form.medioEntrega,
      });
      // descontar desembolso del fondo según medio
      const des = PE.desembolso({ capital: p.capital, interesTotal: p.interesTotal, modalidad: p.modalidad });
      if (p.medioEntrega === 'efectivo') S.fondo.efectivo -= des;
      else S.fondo.transferencia -= des;
      S.prestamos.push(p);
      showCrear.value = false;

      const soc = PE.socio(p.socioId);
      comprobante.value = {
        tipo: 'DESEMBOLSO',
        color: 'amarillo',
        socio: soc.nombre,
        telefono: soc.telefono,
        prestamoId: p.id,
        lineas: [
          ['CAPITAL', PE.fmt(p.capital)],
          ['TASA', PE.pct(p.tasaPct) + ' · ' + p.tipo.toUpperCase()],
          ['MODALIDAD', p.modalidad.toUpperCase()],
          ['CUOTAS', p.nCuotas + ' · ' + p.periodicidad.toUpperCase()],
          ['INTERÉS', PE.fmt(p.interesTotal)],
          ['TOTAL A PAGAR', PE.fmt(p.total)],
          ['VALOR CUOTA', PE.fmt(p.valorCuota)],
          ['DESEMBOLSADO', PE.fmt(des) + ' · ' + p.medioEntrega.toUpperCase()],
        ],
        destacado: ['ENTREGADO', PE.fmt(des)],
      };
      showComprobante.value = true;
      flash('PRÉSTAMO CREADO');
    }

    // ============================================================
    // 4. DETALLE
    // ============================================================
    function abrirDetalle(p) {
      prestamoActivoId.value = p.id;
      showDetalle.value = true;
    }

    // ============================================================
    // 5. ABONO
    // ============================================================
    const abonoForm = reactive({ monto: 0, fecha: PE.isoDate(PE.HOY), formaPago: 'efectivo' });
    function abrirAbono() {
      const p = prestamoActivo.value;
      abonoForm.monto = p ? Math.min(p.valorCuota, p.saldoActual) : 0;
      abonoForm.fecha = PE.isoDate(PE.HOY);
      abonoForm.formaPago = 'efectivo';
      showAbono.value = true;
    }
    const abonoValido = computed(() => {
      const p = prestamoActivo.value;
      const m = Number(abonoForm.monto) || 0;
      return p && m > 0 && m <= p.saldoActual;
    });
    function confirmarAbono() {
      const p = prestamoActivo.value;
      if (!p || !abonoValido.value) return;
      const monto = Number(abonoForm.monto);
      const ab = PE.aplicarAbono(p, monto, { fecha: abonoForm.fecha, formaPago: abonoForm.formaPago });
      // recomponer fondo (entra dinero)
      if (abonoForm.formaPago === 'efectivo') S.fondo.efectivo += monto;
      else S.fondo.transferencia += monto;
      showAbono.value = false;
      const soc = PE.socio(p.socioId);
      comprobante.value = {
        tipo: 'ABONO',
        color: 'verde',
        socio: soc.nombre,
        telefono: soc.telefono,
        prestamoId: p.id,
        lineas: [
          ['FECHA', PE.fmtFecha(ab.fecha)],
          ['FORMA PAGO', ab.formaPago.toUpperCase()],
          ['CUOTAS TOCADAS', ab.cuotas.length ? '#' + ab.cuotas.join(', #') : '—'],
          ['SALDO ANTERIOR', PE.fmt(ab.saldoAnterior)],
          ['ABONO', PE.fmt(ab.monto)],
          ['SALDO NUEVO', PE.fmt(ab.saldoNuevo)],
        ],
        destacado: ['NUEVO SALDO', PE.fmt(ab.saldoNuevo)],
      };
      showComprobante.value = true;
      if (p.estado === 'pagado') { flash('¡PRÉSTAMO SALDADO!'); tab.value = 'pagados'; }
      else flash('ABONO REGISTRADO');
    }

    // reenviar comprobante de un abono histórico
    function reenviarAbono(p, ab) {
      const soc = PE.socio(p.socioId);
      comprobante.value = {
        tipo: 'ABONO',
        color: 'verde',
        socio: soc.nombre,
        telefono: soc.telefono,
        prestamoId: p.id,
        lineas: [
          ['FECHA', PE.fmtFecha(ab.fecha)],
          ['FORMA PAGO', (ab.formaPago || '—').toUpperCase()],
          ['CUOTAS TOCADAS', ab.cuotas && ab.cuotas.length ? '#' + ab.cuotas.join(', #') : '—'],
          ['SALDO ANTERIOR', PE.fmt(ab.saldoAnterior)],
          ['ABONO', PE.fmt(ab.monto)],
          ['SALDO NUEVO', PE.fmt(ab.saldoNuevo)],
        ],
        destacado: ['NUEVO SALDO', PE.fmt(ab.saldoNuevo)],
      };
      showComprobante.value = true;
    }

    // ============================================================
    // 6. REFINANCIAR
    // ============================================================
    const refiForm = reactive({
      fechaPrimeraCuota: PE.isoDate(new Date(2026, 7, 5)),
      nCuotas: 6, tasaPct: 2, tipo: 'simple',
    });
    function abrirRefi() {
      const p = prestamoActivo.value;
      refiForm.fechaPrimeraCuota = PE.isoDate(new Date(2026, 7, 5));
      refiForm.nCuotas = p ? p.nCuotas : 6;
      refiForm.tasaPct = p ? p.tasaPct : 2;
      refiForm.tipo = p ? p.tipo : 'simple';
      showRefi.value = true;
    }
    const refiPreview = computed(() => {
      const p = prestamoActivo.value;
      const n = Number(refiForm.nCuotas) || 0;
      if (!p || n < 1) return null;
      return PE.generarPlan({
        capital: p.saldoActual, tasaPct: Number(refiForm.tasaPct) || 0,
        tipo: refiForm.tipo, modalidad: p.modalidad, nCuotas: n,
        periodicidad: p.periodicidad, fechaPrimeraCuota: new Date(refiForm.fechaPrimeraCuota),
      });
    });
    const refiValido = computed(() => {
      const n = Number(refiForm.nCuotas) || 0;
      return n >= 1 && n <= S.reglas.plazo_maximo;
    });
    function confirmarRefi() {
      const p = prestamoActivo.value;
      if (!p || !refiValido.value) return;
      PE.refinanciar(p, {
        fechaPrimeraCuota: new Date(refiForm.fechaPrimeraCuota),
        nCuotas: Number(refiForm.nCuotas),
        tasaPct: Number(refiForm.tasaPct),
        tipo: refiForm.tipo,
      });
      showRefi.value = false;
      flash('PRÉSTAMO REFINANCIADO');
    }

    // ============================================================
    // 7. ELIMINAR
    // ============================================================
    function abrirEliminar() { showEliminar.value = true; }
    function confirmarEliminar() {
      const p = prestamoActivo.value;
      if (!p) return;
      const idx = S.prestamos.findIndex(x => x.id === p.id);
      if (idx >= 0) S.prestamos.splice(idx, 1);
      showEliminar.value = false;
      showDetalle.value = false;
      prestamoActivoId.value = null;
      flash('PRÉSTAMO ELIMINADO');
    }

    // ============================================================
    // 8. SIMULAR COBRO EN CUOTAS
    // ============================================================
    const cobro = reactive({
      socioId: '',
      periodicidad: 'mensual',
      fecha: PE.isoDate(PE.HOY),
      montoRecibido: 0,
      sancion: 15000,
      actividades: 5000,
      cuotaNatillera: 50000,
      cuotasSel: {},   // { "prestamoId|n": true }
    });

    function abrirCobro() {
      // primer socio con préstamos activos
      const conActivos = S.socios.filter(s =>
        S.prestamos.some(p => p.socioId === s.id && p.estado === 'activo')
      );
      cobro.socioId = conActivos[0]?.id || sociosActivos.value[0]?.id || '';
      cobro.periodicidad = 'mensual';
      cobro.fecha = PE.isoDate(PE.HOY);
      cobro.sancion = 15000;
      cobro.actividades = 5000;
      cobro.cuotaNatillera = 50000;
      cobro.cuotasSel = {};
      recalcCuotasCobro();
      showCobro.value = true;
    }

    const socioTieneActivos = computed(() =>
      S.socios.filter(s => S.prestamos.some(p => p.socioId === s.id && p.estado === 'activo'))
    );

    const periodoCobro = computed(() =>
      PE.periodoDeFecha(new Date(cobro.fecha), cobro.periodicidad)
    );

    const cuotasCobro = computed(() => {
      const delSocio = S.prestamos.filter(p => p.socioId === cobro.socioId && p.estado === 'activo');
      return PE.cuotasPrestamoParaPeriodo(delSocio, periodoCobro.value);
    });

    // preseleccionar todas cuando cambian
    function recalcCuotasCobro() {
      const sel = {};
      for (const c of cuotasCobro.value) sel[c.prestamoId + '|' + c.n] = true;
      cobro.cuotasSel = sel;
      // monto sugerido = sanción + actividades + suma pendiente cuotas + cuota natillera
      const sumaP = cuotasCobro.value.reduce((s, c) => s + c.pendiente, 0);
      cobro.montoRecibido = (cobro.sancion || 0) + (cobro.actividades || 0) + sumaP + (cobro.cuotaNatillera || 0);
    }
    watch(() => [cobro.socioId, cobro.fecha, cobro.periodicidad], () => {
      if (showCobro.value) recalcCuotasCobro();
    });

    const cuotasSeleccionadas = computed(() =>
      cuotasCobro.value.filter(c => cobro.cuotasSel[c.prestamoId + '|' + c.n])
    );

    function keyCuota(c) { return c.prestamoId + '|' + c.n; }
    function toggleCuota(c) {
      cobro.cuotasSel[keyCuota(c)] = !cobro.cuotasSel[keyCuota(c)];
    }

    const repartoCobro = computed(() => {
      return PE.aplicarPagoCuotas({
        montoRecibido: Number(cobro.montoRecibido) || 0,
        sancion: Number(cobro.sancion) || 0,
        actividades: Number(cobro.actividades) || 0,
        cuotasPrestamoSel: cuotasSeleccionadas.value,
        cuotaNatillera: Number(cobro.cuotaNatillera) || 0,
      });
    });

    function confirmarCobro() {
      const rep = repartoCobro.value;
      // aplicar abonos reales sobre cada préstamo (agrupado por prestamoId)
      const porPrestamo = {};
      for (const d of rep.detallePrestamo) {
        porPrestamo[d.prestamoId] = (porPrestamo[d.prestamoId] || 0) + d.aplicado;
      }
      let pasoAPagado = false;
      for (const pid in porPrestamo) {
        const p = S.prestamos.find(x => x.id === pid);
        if (!p) continue;
        PE.aplicarAbono(p, porPrestamo[pid], { fecha: cobro.fecha, formaPago: 'efectivo' });
        S.fondo.efectivo += porPrestamo[pid];
        if (p.estado === 'pagado') pasoAPagado = true;
      }
      showCobro.value = false;

        lineas: [
          ['PERÍODO', PE.periodoLabel(periodoCobro.value)],

          ['3 · PRÉSTAMO', PE.fmt(rep.prestamo)],

          ['SOBRANTE', PE.fmt(rep.sobrante)],

        destacado: ['A PRÉSTAMO', PE.fmt(rep.prestamo)],
      };

    }

    // ============================================================
    // 9. COMPROBANTE — descargar / whatsapp
    // ============================================================
    function descargarComprobante() {
      const c = comprobante.value;
      if (!c) return;
      let txt = 'NATILLERAPP — ' + c.tipo + '\n';
      txt += '================================\n';
      txt += 'SOCIO: ' + c.socio + '\n';
      for (const [k, v] of c.lineas) txt += k + ': ' + v + '\n';
      txt += '================================\n';
      const blob = new Blob([txt], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'comprobante-' + c.tipo.toLowerCase().replace(/\s+/g, '-') + '.txt';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      flash('COMPROBANTE DESCARGADO');
    }
    function enviarWhatsapp() {
      const c = comprobante.value;
      if (!c) return;
      if (!c.telefono) {
        telefonoTmp.value = '';
        telefonoPendienteAccion.value = 'whatsapp';
        showTelefono.value = true;
        return;
      }
      abrirWhatsappReal(c.telefono);
    }
    function abrirWhatsappReal(tel) {
      const c = comprobante.value;

      txt += 'Socio: ' + c.socio + '%0A';
      for (const [k, v] of c.lineas) txt += k + ': ' + v + '%0A';
      const url = 'https://wa.me/57' + tel.replace(/\D/g, '') + '?text=' + txt;
      window.open(url, '_blank');
      flash('WHATSAPP (MOCK) ABIERTO');
    }

          <p class="font-black text-xl uppercase leading-none">NATILLERAPP</p>
          <p class="font-body font-bold text-[11px] uppercase mt-1">{{ comprobante.tipo }}</p>
          <p class="font-black text-sm uppercase mt-2">{{ comprobante.socio }}</p>
        </div>

        <!-- destacado -->
        <div class="brut bg-ink text-amarillo p-3 text-center">
          <p class="text-[10px] uppercase font-bold text-white/70">{{ comprobante.destacado[0] }}</p>
          <p class="font-black text-3xl tabnum leading-none mt-1">{{ comprobante.destacado[1] }}</p>
        </div>

        <!-- líneas -->
        <div class="brut-2 bg-white">
          <div v-for="(l,i) in comprobante.lineas" :key="i" class="flex justify-between gap-3 px-3 py-1.5" :class="i? 'border-t-2 border-ink/15':''">
            <span class="font-body font-bold text-[11px] uppercase opacity-70">{{ l[0] }}</span>
            <span class="font-black text-sm tabnum text-right">{{ l[1] }}</span>
          </div>
        </div>

        <div class="flex gap-2 pt-1 safe-bottom">
          <button @click="descargarComprobante" class="btn-brut bg-white text-ink flex-1 py-3 !text-xs">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
            Descargar
          </button>
          <button @click="enviarWhatsapp" class="btn-brut bg-verde text-white flex-1 py-3 !text-xs">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 20l1.5-4A8 8 0 1 1 9 19.5z"/></svg>
            WhatsApp
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== PEDIR TELÉFONO ===== -->
  <div v-if="showTelefono" class="fixed inset-0 z-[58] veil flex items-center justify-center p-4" @click.self="showTelefono=false">
    <div class="bg-crema brut sh w-full max-w-sm flex flex-col pop">
      <div class="bg-verde text-white brut flex items-center gap-3 p-3" style="border-width:0 0 3px 0;">
        <div class="w-9 h-9 bg-white text-verde brut-2 flex items-center justify-center shrink-0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 4h4l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
        </div>
        <h2 class="font-black text-lg uppercase leading-none flex-1">Falta teléfono</h2>
        <button @click="showTelefono=false" class="w-9 h-9 bg-white text-ink brut-2 font-black shrink-0 flex items-center justify-center">✕</button>
      </div>
      <div class="p-4 space-y-3 safe-bottom">
        <p class="font-body font-bold text-xs uppercase">Este socio no tiene teléfono. Escríbelo para enviar el comprobante.</p>
        <input v-model="telefonoTmp" type="tel" inputmode="numeric" placeholder="3001234567" class="in-brut tabnum" />
        <div class="flex gap-2">
          <button @click="showTelefono=false" class="btn-brut bg-white text-ink flex-1 py-3 text-sm">Cancelar</button>
          <button @click="confirmarTelefono" :disabled="!telefonoTmp.trim()" class="btn-brut bg-verde text-white flex-1 py-3 text-sm">Enviar</button>
        </div>
      </div>
    </div>
  </div>

</div>
  `,
}).mount('#app');
</script>
</body>
</html>
