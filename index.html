    <title>Natillerapp – App gratis para llevar tu natillera: cuotas, préstamos y cierre</title>

    <meta name="theme-color" content="#1B5E37" />
    <!-- Preconnect + dns-prefetch a Supabase para mejorar tiempo de primera carga -->
    <link rel="preconnect" href="https://vdtjacwpvqfifahkrqxp.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://vdtjacwpvqfifahkrqxp.supabase.co" />

    <meta property="og:type" content="website" />
