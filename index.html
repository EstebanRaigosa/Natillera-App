<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://natillerapp.com/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no, interactive-widget=resizes-visual" />
    <!--
      SEO: estos son los datos de la portada («/»). En el build, scripts/prerender-publico.mjs
      escribe el título, la descripción, el canonical y el Open Graph de cada página pública
      (textos en src/views/publico/contenidoPublico.js) y deja noindex en el cascarón de la
      app. Al navegar los ajusta el router (src/utils/seoRuta.js).
    -->
    <title>Natillerapp – App gratis para llevar tu natillera: cuotas, préstamos y cierre</title>
    <meta name="description" content="Lleva tu natillera sin cuadernos ni planillas: cuotas y multas, préstamos entre socios, rifas, caja y cierre de fin de año. Gratis, en el celular o la computadora." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1B5E37" />
    <!-- Mulish (tipografía de la marca). Aquí y no con @import en el CSS: así se pide en paralelo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" />
    <!-- Preconnect + dns-prefetch a Supabase para mejorar tiempo de primera carga -->
    <link rel="preconnect" href="https://vdtjacwpvqfifahkrqxp.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://vdtjacwpvqfifahkrqxp.supabase.co" />
    <!-- Open Graph (Facebook, LinkedIn, compartir en redes) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://natillerapp.com/" />
    <meta property="og:title" content="Natillerapp – App gratis para llevar tu natillera" />
    <meta property="og:description" content="Cuotas, multas, préstamos, rifas y el cierre de fin de año en un solo lugar. Gratis, en el celular o la computadora." />
    <!-- Nombre nuevo a propósito: WhatsApp y Facebook guardan la vista previa por URL y no
         verían el cambio si se reemplazara og-image.jpg. Se genera con scripts/generar-og-image.mjs. -->
    <meta property="og:image" content="https://natillerapp.com/og-natillerapp.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Natillerapp: gestiona el ahorro de tu natillera desde cualquier lugar. La app en computadora y celular con el ahorro del grupo y las cuotas de los socios." />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="Natillerapp" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Natillerapp – App gratis para llevar tu natillera" />
    <meta name="twitter:description" content="Cuotas, multas, préstamos, rifas y el cierre de fin de año en un solo lugar." />
    <meta name="twitter:image" content="https://natillerapp.com/og-natillerapp.jpg" />
    <!-- Datos estructurados para buscadores (WebApplication, web + móvil) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Natillerapp",
      "description": "App gratuita para gestionar natilleras: cuotas y multas, préstamos entre socios, rifas y actividades, caja y cierre de fin de año. Funciona en celular y en computadora.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web, Android, iOS",
      "inLanguage": "es-CO",
      "url": "https://natillerapp.com/",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "COP" },
      "image": "https://natillerapp.com/og-natillerapp.jpg",
      "featureList": "Cuotas y multas por mora, préstamos entre socios con plan de pagos, rifas y actividades, libro de caja y conciliación, cierre y reparto de fin de año, comprobantes por WhatsApp",
      "publisher": { "@id": "https://natillerapp.com/#organizacion" }
    }
    </script>
    <!-- Quién está detrás de la app: ayuda a Google a asociar la marca con el sitio y el logo -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://natillerapp.com/#organizacion",
      "name": "Natillerapp",
      "url": "https://natillerapp.com/",
      "logo": "https://natillerapp.com/android-chrome-512x512.png"
    }
    </script>
    <!-- Meta tags específicos para iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
