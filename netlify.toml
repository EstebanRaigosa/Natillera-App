[build]
  command = "npm run build"
  publish = "dist"

# Las rutas de la app caen al cascarón vacío. `index.html` es la portada pre-renderizada
# (SEO) y solo se sirve en «/», porque Netlify entrega primero los archivos que existen.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# El service worker y su registro NO deben cachearse en el navegador/CDN, o los usuarios
# quedarían atascados en una versión vieja del SW y no llegarían las actualizaciones (PWA).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

